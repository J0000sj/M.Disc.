<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego del Ahorcado</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background: #f8fafc; 
            color: #1e293b; 
            padding: 20px; 
            margin: 0; 
        }
        h1 { margin-bottom: 5px; }

        .contenedor-principal {
            display: flex;
            max-width: 800px;
            margin: 0 auto;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .juego-lado { flex: 1; min-width: 300px; }
      
        .imagen-lado { 
            width: 210px; 
            height: 210px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .imagen-lado img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            border-radius: 12px;
            
            animation: balanceo 3s ease-in-out infinite alternate;
            transform-origin: bottom center; 
        }

        
        @keyframes balanceo {
            0% { transform: rotate(-6deg); }
            100% { transform: rotate(6deg); }
        }

        .barra-vida { width: 200px; height: 16px; background: #e2e8f0; margin: 15px auto; border-radius: 8px; overflow: hidden; }
        #progreso-vida { width: 100%; height: 100%; background: #ef4444; transition: width 0.3s; }
        
        #palabra { font-size: 2.5rem; letter-spacing: 10px; margin: 20px 0; font-weight: bold; }
        
        #teclado { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; max-width: 450px; margin: 0 auto; }
        .btn { padding: 10px 0; font-size: 1.1rem; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 4px; font-weight: bold; }
        .btn:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }
        
        #nuevo { padding: 12px 25px; font-size: 1rem; font-weight: bold; background: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 25px; }
        .marcador { font-size: 1.2rem; margin: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Ahorcado</h1>

    <div class="contenedor-principal">
        
        
        <div class="juego-lado">
            <div class="barra-vida">
                <div id="progreso-vida"></div>
            </div>

            <div class="marcador">Puntos: <span id="puntos" style="color: #2ecc71;">0</span></div>
            <div id="palabra">_ _ _ _ _</div>
            <p>Intentos restantes: <b id="vidas" style="color:#ef4444">6</b></p>
            
            <div id="teclado"></div>
        </div>

        
        <div class="imagen-lado">
            
            <img src="bufalo.png" alt="Búfalo Animado">
        </div>

    </div>

    <button id="nuevo" onclick="jugar()">Siguiente Palabra ➔</button>

    <script>
        const palabras = ["BUFALO", "ANIVERSARIO", "TECNOLOGICO", "UNIVERSIDAD", "FUNDACION", "MEXICALI", "EXCELENCIA", "INGENIERIA"];
        let secreta, progreso, vidas, ganadas = 0; 

        function jugar() {
            vidas = 6;
            secreta = palabras[Math.floor(Math.random() * palabras.length)];
            progreso = Array(secreta.length).fill("_");
            
            document.getElementById("teclado").innerHTML = "";
            "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("").forEach(letra => {
                const b = document.createElement("button");
                b.textContent = letra;
                b.className = "btn";
                b.onclick = () => {
                    b.disabled = true;
                    if (secreta.includes(letra)) {
                        for(let i=0; i<secreta.length; i++) if(secreta[i] === letra) progreso[i] = letra;
                        if (!progreso.includes("_")) {
                            ganadas++; 
                            setTimeout(() => alert("Ganaste 🙀🙀"), 50);
                            bloquear();
                        }
                    } else {
                        vidas--;
                        if (vidas === 0) {
                            setTimeout(() => alert("Perdiste 😹 Era: " + secreta), 50);
                            bloquear();
                        }
                    }
                    dibujar();
                };
                document.getElementById("teclado").appendChild(b);
            });
            dibujar();
        }

        function dibujar() {
            document.getElementById("palabra").textContent = progreso.join(" ");
            document.getElementById("vidas").textContent = vidas;
            document.getElementById("puntos").textContent = ganadas;
            document.getElementById("progreso-vida").style.width = (vidas / 6 * 100) + "%";
        }

        function bloquear() {
            document.querySelectorAll(".btn").forEach(b => b.disabled = true);
        }

        jugar(); 
    </script>
</body>
</html>
